# Trois profils, jamais lancés ensemble :
#
#   docker compose --profile dev     up            → http://localhost:3777, à chaud
#   docker compose --profile prod    up -d --build → http://localhost:3000, image de prod en local
#   docker compose --profile traefik up -d --build → mise en ligne derrière Traefik
#
# Sans --profile, `docker compose up` ne démarre rien : c'est voulu, ça évite
# de lancer la prod en croyant lancer le dev.

services:
  # ─────────────────────────── développement ───────────────────────────
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    ports:
      - "3777:3777"
    volumes:
      # Le code vient de l'hôte : une modification est prise à chaud
      - .:/app
      # Volumes anonymes : gardent les node_modules et le .next DU CONTENEUR.
      # Sans eux, le montage ci-dessus les écraserait avec ceux du Mac —
      # binaires compilés pour la mauvaise plateforme, sharp en tête.
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    restart: unless-stopped

  # ─────────────────── production, en local (sans Traefik) ─────────────
  # Sert à vérifier l'image de prod sur son poste avant de la déployer.
  web:
    profiles: ["prod"]
    image: dog-aventure:latest
    build:
      context: .
      target: runner
    # Boucle locale seulement : rien n'est exposé à l'internet.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      - image-cache:/app/.next/cache
    # Le HEALTHCHECK est défini dans le Dockerfile
    restart: unless-stopped

  # ──────────────────── mise en ligne, derrière Traefik ────────────────
  # Pas de `ports:` : Traefik joint le conteneur par le réseau Docker partagé.
  # Publier un port ici ouvrirait un accès en clair contournant le proxy.
  site:
    profiles: ["traefik"]
    image: dog-aventure:latest
    build:
      context: .
      target: runner
    container_name: dog-aventure
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      # Sans ce volume, next/image ré-encode toutes les images à chaque
      # redémarrage — coûteux sur une petite machine.
      - image-cache:/app/.next/cache
    labels:
      - "traefik.enable=true"
      # doogaventure.fr est le domaine réel depuis le 2026-08-12.
      # dog-aventure.com est SERVI, mais plus jamais annoncé : le canonical
      # désigne le .fr, donc pas de contenu dupliqué. Il est là uniquement le
      # temps que le DNS du .fr se propage ; sans lui le site tomberait
      # pendant la bascule. À RETIRER une fois le .fr confirmé en ligne.
      # Surtout ne PAS le rediriger en 301 vers le .fr : ce serait transmettre
      # au nouveau domaine la réputation qui a fait refuser Google Ads.
      - "traefik.http.routers.dogaventure.rule=Host(`doogaventure.fr`) || Host(`www.doogaventure.fr`) || Host(`dog-aventure.com`) || Host(`www.dog-aventure.com`)"
      - "traefik.http.routers.dogaventure.entrypoints=websecure"
      - "traefik.http.routers.dogaventure.tls.certresolver=letsencrypt"
      - "traefik.http.services.dogaventure.loadbalancer.server.port=3000"

      # Compression
      - "traefik.http.middlewares.dogaventure-compress.compress=true"

      # www → apex, en 301 : le canonical du site désigne l'apex.
      # Le domaine est capturé pour que chaque www retombe sur SON PROPRE
      # apex — www.dog-aventure.com ne doit pas atterrir sur le .fr.
      - "traefik.http.middlewares.dogaventure-www-redirect.redirectregex.regex=^https://www\\.(doogaventure\\.fr|dog-aventure\\.com)/(.*)"
      - "traefik.http.middlewares.dogaventure-www-redirect.redirectregex.replacement=https://$${1}/$${2}"
      - "traefik.http.middlewares.dogaventure-www-redirect.redirectregex.permanent=true"

      # En-têtes de sécurité
      - "traefik.http.middlewares.dogaventure-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.dogaventure-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.dogaventure-security.headers.stsPreload=true"
      - "traefik.http.middlewares.dogaventure-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.dogaventure-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.dogaventure-security.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=()"
      - "traefik.http.middlewares.dogaventure-security.headers.customFrameOptionsValue=SAMEORIGIN"
      # CSP taillée pour CE site, vérifiée sur le HTML produit :
      #   frame-src www.google.com → l'iframe Maps de la section « Où j'interviens ».
      #     C'est la seule origine externe de toute la page ; sans elle, carte blanche.
      #   pas de fonts.googleapis/gstatic → next/font sert les polices depuis le domaine.
      #   style-src 'unsafe-inline' → obligatoire, le CSS est inliné (experimental.inlineCss).
      #   script-src sans 'unsafe-eval' → volontaire ; voir le README avant de l'ajouter.
      - "traefik.http.middlewares.dogaventure-security.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://www.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

      # Limitation de débit. sourceCriterion est indispensable derrière
      # Cloudflare : sans lui Traefik ne voit que les IP des serveurs
      # Cloudflare, compte tout le trafic d'un même point de présence sur un
      # seul compteur, et finit par renvoyer 429 à de vrais visiteurs.
      - "traefik.http.middlewares.dogaventure-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.dogaventure-ratelimit.ratelimit.burst=100"
      - "traefik.http.middlewares.dogaventure-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.dogaventure-ratelimit.ratelimit.sourceCriterion.requestHeaderName=CF-Connecting-IP"

      - "traefik.http.routers.dogaventure.middlewares=dogaventure-compress,dogaventure-www-redirect,dogaventure-security,dogaventure-ratelimit"
    networks:
      - proxy

volumes:
  image-cache:

networks:
  proxy:
    external: true
    # Le réseau où tourne déjà Traefik. Surchargeable sans toucher au fichier :
    # TRAEFIK_NETWORK=autre-reseau docker compose --profile traefik up -d
    name: ${TRAEFIK_NETWORK:-n8n-network}
